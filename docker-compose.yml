services:
  postgres:
    image: postgres:16-alpine
    container_name: codementor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codementor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codementor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codementor}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codementor-net

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: codementor-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "${PISTON_PORT:-2000}:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,mode=777
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:2000/api/v2/runtimes').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codementor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-codementor_secret}@postgres:5432/${POSTGRES_DB:-codementor}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PISTON_API_URL: ${PISTON_API_URL:-http://piston:2000/api/v2}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codementor-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: codementor-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - codementor-net

volumes:
  postgres_data:
    driver: local
  piston_packages:
    driver: local

networks:
  codementor-net:
    driver: bridge
